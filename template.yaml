AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  serverless-api-aws: expenses REST API on AWS Lambda + API Gateway (HTTP API) + DynamoDB,
  with a static frontend on a private S3 bucket served by CloudFront.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: API Gateway stage name
  AlarmEmail:
    Type: String
    Description: E-mail that receives CloudWatch alarm notifications
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: CORS origin allowed to call the API (set to the CloudFront URL after the first deploy)

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64] # Graviton: about 20% cheaper per GB-second than x86
    MemorySize: 256
    Timeout: 10
    Tracing: Active # AWS X-Ray
    LoggingConfig:
      LogFormat: JSON
    Environment:
      Variables:
        TABLE_NAME: !Ref ExpensesTable

Resources:
  # ---------- Data ----------

  ExpensesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub "${AWS::StackName}-expenses"
      BillingMode: PAY_PER_REQUEST # on-demand: pay per request, scales automatically
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ---------- API ----------

  ExpensesApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowMethods: [GET, POST, DELETE, OPTIONS]
        AllowHeaders: [Content-Type]
        MaxAge: 600
      # Protects the account (and the bill) against abuse
      DefaultRouteSettings:
        ThrottlingBurstLimit: 200
        ThrottlingRateLimit: 100
        DetailedMetricsEnabled: true
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","route":"$context.routeKey","status":"$context.status","latencyMs":"$context.responseLatency","integrationLatencyMs":"$context.integrationLatency","error":"$context.integrationErrorMessage"}'

  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${AWS::StackName}-access"
      RetentionInDays: 14

  ExpensesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-expenses"
      Description: CRUD and summary of personal expenses
      CodeUri: src/expenses/
      Handler: app.handler
      # Least privilege: CRUD on this single table only
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ExpensesTable
      Events:
        ListExpenses:
          Type: HttpApi
          Properties:
            ApiId: !Ref ExpensesApi
            Path: /expenses
            Method: GET
        CreateExpense:
          Type: HttpApi
          Properties:
            ApiId: !Ref ExpensesApi
            Path: /expenses
            Method: POST
        GetSummary:
          Type: HttpApi
          Properties:
            ApiId: !Ref ExpensesApi
            Path: /expenses/summary
            Method: GET
        GetExpense:
          Type: HttpApi
          Properties:
            ApiId: !Ref ExpensesApi
            Path: /expenses/{id}
            Method: GET
        DeleteExpense:
          Type: HttpApi
          Properties:
            ApiId: !Ref ExpensesApi
            Path: /expenses/{id}
            Method: DELETE

  ExpensesFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ExpensesFunction}"
      RetentionInDays: 14

  # ---------- Frontend: private S3 bucket behind CloudFront ----------

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  # Origin Access Control: only this CloudFront distribution can read the bucket
  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} frontend"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100 # North America and Europe edges only: cheapest option
        Origins:
          - Id: frontend-s3
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: frontend-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt FrontendBucket.Arn
              - !Sub "${FrontendBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ---------- Observability ----------

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-alarms"
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  FunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-lambda-errors"
      AlarmDescription: The expenses function returned errors in the last 5 minutes
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ExpensesFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  FunctionThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-lambda-throttles"
      AlarmDescription: Lambda is being throttled (account concurrency limit reached)
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref ExpensesFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-api-5xx"
      AlarmDescription: The HTTP API returned 5xx responses in the last 5 minutes
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref ExpensesApi
        - Name: Stage
          Value: !Ref Stage
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}-operations"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "API: requests and errors",
                "region": "${AWS::Region}", "stat": "Sum", "period": 60, "view": "timeSeries",
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiId", "${ExpensesApi}", "Stage", "${Stage}"],
                  [".", "4xx", ".", ".", ".", "."],
                  [".", "5xx", ".", ".", ".", "."]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "API: latency (ms)",
                "region": "${AWS::Region}", "period": 60, "view": "timeSeries",
                "metrics": [
                  ["AWS/ApiGateway", "Latency", "ApiId", "${ExpensesApi}", "Stage", "${Stage}", {"stat": "p50"}],
                  ["...", {"stat": "p95"}],
                  ["...", {"stat": "p99"}]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda: invocations, errors, throttles and concurrency",
                "region": "${AWS::Region}", "period": 60, "view": "timeSeries",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${ExpensesFunction}", {"stat": "Sum"}],
                  [".", "Errors", ".", ".", {"stat": "Sum"}],
                  [".", "Throttles", ".", ".", {"stat": "Sum"}],
                  [".", "ConcurrentExecutions", ".", ".", {"stat": "Maximum"}]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda: duration (ms)",
                "region": "${AWS::Region}", "period": 60, "view": "timeSeries",
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${ExpensesFunction}", {"stat": "p50"}],
                  ["...", {"stat": "p95"}],
                  ["...", {"stat": "Maximum"}]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 12, "width": 24, "height": 6,
              "properties": {
                "title": "DynamoDB: consumed capacity",
                "region": "${AWS::Region}", "stat": "Sum", "period": 60, "view": "timeSeries",
                "metrics": [
                  ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${ExpensesTable}"],
                  [".", "ConsumedWriteCapacityUnits", ".", "."]
                ]
              }
            }
          ]
        }

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API
    Value: !Sub "https://${ExpensesApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  FunctionName:
    Description: Lambda function name
    Value: !Ref ExpensesFunction
  TableName:
    Description: DynamoDB table name
    Value: !Ref ExpensesTable
  FrontendUrl:
    Description: HTTPS URL of the frontend (CloudFront)
    Value: !Sub "https://${FrontendDistribution.DomainName}"
  FrontendBucketName:
    Description: Bucket that receives the frontend files
    Value: !Ref FrontendBucket
  DistributionId:
    Description: CloudFront distribution ID (used for cache invalidation)
    Value: !Ref FrontendDistribution
  DashboardUrl:
    Description: CloudWatch dashboard with API, Lambda and DynamoDB metrics
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${OperationsDashboard}"

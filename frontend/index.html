<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controle de Despesas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <h1>Controle de Despesas</h1>
      <p class="subtitle">API serverless na AWS: Lambda + API Gateway + DynamoDB</p>
    </header>

    <section class="card">
      <h2>Nova despesa</h2>
      <form id="expense-form">
        <label>Descrição
          <input name="description" maxlength="200" required placeholder="Ex.: Almoço">
        </label>
        <label>Valor (R$)
          <input name="amount" type="number" min="0.01" step="0.01" required>
        </label>
        <label>Categoria
          <select name="category">
            <option value="alimentacao">Alimentação</option>
            <option value="transporte">Transporte</option>
            <option value="moradia">Moradia</option>
            <option value="lazer">Lazer</option>
            <option value="saude">Saúde</option>
            <option value="educacao">Educação</option>
            <option value="outros" selected>Outros</option>
          </select>
        </label>
        <label>Data
          <input name="date" type="date">
        </label>
        <button type="submit">Adicionar</button>
      </form>
      <p id="message" role="status"></p>
    </section>

    <section class="card">
      <h2>Resumo</h2>
      <p class="total">Total: <strong id="total">R$ 0,00</strong></p>
      <ul id="summary"></ul>
    </section>

    <section class="card">
      <h2>Despesas</h2>
      <table>
        <thead>
          <tr><th>Data</th><th>Descrição</th><th>Categoria</th><th class="num">Valor</th><th></th></tr>
        </thead>
        <tbody id="expenses"></tbody>
      </table>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
